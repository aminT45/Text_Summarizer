<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Summarizer</title>
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
      margin: 0;
      padding: 40px;
      color: #fff;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      background: rgba(20, 20, 40, 0.9);
      border: 2px solid #00ffe7;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 25px #00ffe7, 0 0 50px #ff00ff;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      background: linear-gradient(90deg, #00ffe7, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    h3 {
      text-align: center;
      color: #ccc;
      margin-top: 10px;
      margin-bottom: 20px;
      font-weight: normal;
    }

    p {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    textarea {
      width: 97%;
      height: 160px;
      padding: 12px;
      border: 2px solid #00ffe7;
      border-radius: 8px;
      font-size: 15px;
      resize: vertical;
      background: rgba(0,0,0,0.6);
      color: #00ffe7;
      box-shadow: inset 0 0 10px #00ffe7;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    textarea:focus {
      border-color: #ff00ff;
      box-shadow: inset 0 0 15px #ff00ff;
      outline: none;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #00ffe7, #ff00ff);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 15px #00ffe7, 0 0 25px #ff00ff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff00ff, 0 0 40px #00ffe7;
    }

    .summary-output {
      margin-top: 25px;
      padding: 18px;
      background: rgba(0,0,0,0.7);
      border: 2px solid #ff00ff;
      border-radius: 12px;
      font-size: 15px;
      color: #00ffe7;
      box-shadow: inset 0 0 20px #ff00ff;
      animation: slideUp 0.6s ease;
    }

    .summary-heading {
      margin-top: 0;
      margin-bottom: 10px;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Text Summarizer ⚡</h1>
    <h3> using HuggingFace Transformer</h3>
    <p>Paste your content below and let AI condense it instantly</p>

    <form id="summarization-form">
      <textarea id="dialogue-input" placeholder="Enter your content here..." required></textarea>
      <button type="submit">Summarize</button>
    </form>

    <div id="summary-output">
      <h3 id="summary-heading">Summary Output</h3>
      <p id="summary-text">Your summarized text will appear here.</p>
    </div>
  </div>
  
  <script>
    document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
        
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");
        
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;
        
            summaryText.innerText = "Processing...";
            submitButton.disabled = true;
        
            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });
        
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
        
                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                
                submitButton.disabled = false;
            }
        });
        
    </script>
</body>
</html>
